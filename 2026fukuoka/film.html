<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>九州慢行誌・旅行短片</title>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@500;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f6f1e7;--dim:rgba(246,241,231,.72);--accent:#e9b872;--bg:#0b0d10}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:'Noto Sans TC',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0;height:100dvh}
video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;cursor:pointer;background:#0b0d10}
.shade{position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.45)),
 linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.4) 26%,transparent 50%),
 linear-gradient(to bottom,rgba(0,0,0,.4),transparent 16%)}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
 padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));
 font:700 12px/1 Manrope,sans-serif;letter-spacing:.18em;pointer-events:none}
.top a{pointer-events:auto;color:var(--ink);text-decoration:none;letter-spacing:.06em;font:500 13px/1 'Noto Sans TC',sans-serif;
 padding:8px 12px;border:1px solid rgba(246,241,231,.35);border-radius:99px;background:rgba(0,0,0,.25);backdrop-filter:blur(6px)}
.cap{position:absolute;left:max(20px,env(safe-area-inset-left));right:20px;bottom:calc(env(safe-area-inset-bottom) + 74px);
 pointer-events:none;max-width:min(100%,60rem)}
.cap>*{opacity:0;transform:translateY(14px);transition:opacity .25s ease,transform .25s ease}
.cap.on>*{opacity:1;transform:none;transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.cap.on>:nth-child(2){transition-delay:.12s}.cap.on>:nth-child(3){transition-delay:.26s}
.cap .k{font:800 clamp(12px,1.6vmin + 6px,16px)/1 Manrope,'Noto Sans TC',sans-serif;letter-spacing:.2em;color:var(--accent);text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.6)}
.cap h2{font:900 clamp(30px,6.2vmin + 10px,68px)/1.15 'Noto Serif TC',serif;margin:.28em 0 .3em;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.cap .c{font:500 clamp(13px,1.4vmin + 8px,17px)/1.5 'Noto Sans TC',sans-serif;color:var(--dim)}
.cap .c span{font-family:Manrope,sans-serif;font-weight:700;letter-spacing:.16em;font-size:.82em;margin-left:.6em}
.cap.title h2{font-size:clamp(32px,6.8vmin + 10px,88px);white-space:nowrap}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;
 padding:0 max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 18px) max(16px,env(safe-area-inset-left))}
.bar button{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(246,241,231,.45);background:rgba(0,0,0,.3);
 color:var(--ink);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.bar button svg{width:16px;height:16px;fill:currentColor}
.track{position:relative;flex:1;height:40px;cursor:pointer;touch-action:none}
.track::before,.fill{content:'';position:absolute;left:0;top:19px;height:2px;border-radius:2px}
.track::before{right:0;background:rgba(246,241,231,.25)}
.fill{background:var(--ink);width:0}
.tick{position:absolute;top:15px;width:1px;height:10px;background:rgba(246,241,231,.5)}
.time{font:600 12px/1 Manrope,sans-serif;letter-spacing:.08em;color:var(--dim);min-width:3.6em;text-align:right}
.load{position:absolute;inset:0;display:grid;place-items:center;font:500 14px/1 'Noto Sans TC',sans-serif;color:var(--dim);
 letter-spacing:.2em;transition:opacity .6s}
.load.done{opacity:0;pointer-events:none}
@media (orientation:landscape) and (max-height:500px){
 .cap{bottom:calc(env(safe-area-inset-bottom) + 58px)}
 .cap h2{font-size:clamp(26px,7vmin,44px)}.cap.title h2{font-size:clamp(32px,9vmin,56px)}
 .bar{padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}
}
</style>
<body>
<div class="stage">
 <video id="v" muted playsinline loop preload="auto" aria-label="九州十天行程旅行短片，點一下暫停或播放"></video>
 <div class="shade"></div>
 <div class="top"><span>KYUSHU · 2026 AUTUMN</span><a href="./">回行程頁</a></div>
 <div class="cap" id="cap" aria-live="polite"><div class="k" id="capK"></div><h2 id="capH"></h2><div class="c" id="capC"></div></div>
 <div class="bar">
  <button id="play" type="button" aria-label="暫停"></button>
  <div class="track" id="track" role="slider" aria-label="影片進度" tabindex="0"><div class="fill" id="fill"></div></div>
  <span class="time" id="time">0:00</span>
 </div>
</div>
<script>
'use strict';
// 影片由 film/ 的 MP4 播放（照片做成緩慢推移＋淡入淡出），字卡依時間切換
const EMBED=new URLSearchParams(location.search).has('embed');
if(EMBED){const a=document.querySelector('.top a');a.href='film.html';a.target='_top';a.textContent='全螢幕看';}
// 每段 5 秒、交疊 1.2 秒 → 第 i 段從 i×3.8 秒開始（與 render 參數一致）
const STEP=3.8,CAPS=[
 {k:'2026 秋 · 十天九夜',h:'從空中看見，九州',c:'福岡 → 武雄 → 長崎 → 豪斯登堡 → 福岡',en:'',title:1},
 {k:'DAY 01 · 10.24 六',h:'先泡一場湯',c:'武雄',en:'TAKEO'},
 {k:'DAY 02 · 10.25 日',h:'朱紅樓門，白瓷器',c:'武雄・有田',en:'TAKEO & ARITA'},
 {k:'DAY 03 · 10.26 一',h:'沿著海，慢慢走',c:'長崎',en:'NAGASAKI'},
 {k:'DAY 04 · 10.27 二',h:'看島，聽城市',c:'長崎・軍艦島',en:'HASHIMA'},
 {k:'DAY 05 · 10.28 三',h:'帶一盒甜，往北',c:'豪斯登堡・森林小屋',en:'HUIS TEN BOSCH'},
 {k:'DAY 06 · 10.29 四',h:'今天不趕路',c:'豪斯登堡・光之城',en:'A DAY WITH NO RUSH'},
 {k:'DAY 07 · 10.30 五',h:'把可愛留一晚',c:'豪斯登堡・米菲兔房',en:'A LITTLE MIFFY DAY'},
 {k:'DAY 08 · 10.31 六',h:'走進祭典的燈',c:'福岡・中洲祭',en:'NAKASU NIGHT'},
 {k:'DAY 09 · 11.01 日',h:'好好逛，好好慶祝',c:'福岡・天神',en:'TENJIN'},
 {k:'DAY 10 · 11.02 一',h:'市場的早餐',c:'福岡・柳橋市場',en:'YANAGIBASHI'},
 {k:'11.02 · 福岡 → 桃園',h:'下次，再回來',c:'KYUSHU 2026',en:'',title:1}];
const $=id=>document.getElementById(id),v=$('v'),cap=$('cap'),btn=$('play'),track=$('track');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tall=matchMedia('(max-aspect-ratio: 4/5)').matches;
v.poster='film/poster-'+(tall?'tall':'wide')+'.jpg';v.src='film/kyushu-'+(tall?'tall':'wide')+'.mp4';
let ci=-1;
function showCap(i){if(i===ci)return;ci=i;cap.classList.remove('on');const c=CAPS[i];
 setTimeout(()=>{if(ci!==i)return;$('capK').textContent=c.k;$('capH').textContent=c.h;
  $('capC').innerHTML='';$('capC').append(c.c);if(c.en){const e=document.createElement('span');e.textContent=c.en;$('capC').append(e);}
  cap.classList.toggle('title',!!c.title);cap.classList.add('on');},200);}
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function tick(){const t=v.currentTime,d=v.duration||1;showCap(Math.min(CAPS.length-1,Math.floor((t+.6)/STEP)));
 $('fill').style.width=(t/d*100)+'%';$('time').textContent=fmt(t);}
v.addEventListener('timeupdate',tick);
const PLAY='<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>',PAUSE='<svg viewBox="0 0 16 16"><path d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/></svg>';
function ui(){btn.innerHTML=v.paused?PLAY:PAUSE;btn.setAttribute('aria-label',v.paused?'播放':'暫停');}
v.addEventListener('play',ui);v.addEventListener('pause',ui);
let auto=false;
const toggle=()=>{auto=false;v.paused?v.play():v.pause();};
btn.addEventListener('click',toggle);v.addEventListener('click',toggle);
// 減少動態效果：只顯示海報與第一張字卡，不自動播放
if(RM){showCap(0);ui();}else v.play().catch(ui);
// 封面捲出畫面就暫停、捲回來接著播；使用者自己按的暫停不會被自動恢復
if(EMBED&&'IntersectionObserver' in window)new IntersectionObserver(([e])=>{
 if(!e.isIntersecting&&!v.paused){auto=true;v.pause();}else if(e.isIntersecting&&auto){auto=false;v.play();}},{threshold:.3}).observe(document.querySelector('.stage'));
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}
 else if(e.key==='ArrowRight'||e.key==='ArrowLeft')v.currentTime=Math.max(0,v.currentTime+(e.key==='ArrowRight'?5:-5));});
function seek(e){const r=track.getBoundingClientRect();v.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*(v.duration||0);}
track.addEventListener('pointerdown',e=>{track.setPointerCapture(e.pointerId);seek(e);});
track.addEventListener('pointermove',e=>{if(track.hasPointerCapture(e.pointerId))seek(e);});
v.addEventListener('loadedmetadata',()=>{for(let i=1;i<CAPS.length;i++){const d=document.createElement('i');d.className='tick';d.style.left=(i*STEP/v.duration*100)+'%';track.append(d);}});
ui();
</script>
</body>
</html>
