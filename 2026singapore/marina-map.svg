<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" role="img" aria-labelledby="map-title map-desc"><title id="map-title">濱海灣地標相對位置示意圖</title><desc id="map-desc">北方朝上，文華東方酒店在北岸。摩天觀景輪位於酒店東南方；螺旋橋在摩天輪西南方。金沙購物廊位於海灣東岸，濱海灣花園在金沙東南側。魚尾獅公園在酒店西南方，富麗敦酒店在魚尾獅西南側，駁船碼頭在富麗敦西北側。紅燈碼頭與老巴剎更往南。位置依 Google Maps 方位簡化，標記可開啟地圖。</desc><rect width="1000" height="740" fill="#eeeade"/><path d="M410 260 L558 262 L603 280 L605 318 L565 335 L541 350 L548 375 L567 400 L557 435 L520 471 L451 538 L360 604 L309 550 L315 460 L337 370 L350 330 L377 302 Z" fill="#bfd9dd" stroke="#98bec2" stroke-width="2"/><path d="M349 330 Q301 311 268 323 Q214 364 160 325 L85 295 L10 278" fill="none" stroke="#bfd9dd" stroke-width="28"/><path d="M802 55 L811 249 L760 306 L690 330 L711 382 L856 435 L1000 486 L1000 90Z" fill="#bfd9dd"/><path d="M665 412 Q771 427 857 485 L834 579 L727 654 L628 604 L609 536Z" fill="#d6dfbd"/><g fill="none" stroke="#d5cdbb" stroke-width="12"><path d="M377 220 L570 244 L689 250"/><path d="M655 150 Q641 276 647 365 Q645 452 540 575"/><path d="M140 402 L238 458 L258 622"/></g><path d="M601 279 L565 335" stroke="#947855" stroke-width="7"/><path d="M364 315 L386 278" stroke="#947855" stroke-width="5"/><g fill="#4c777a" font-family="sans-serif"><text x="382" y="407" font-size="33">濱海灣</text><text x="389" y="436" font-size="18">MARINA BAY</text><text x="74" y="355" font-size="20">新加坡河</text></g><g font-family="sans-serif" fill="#172f2a"><text x="850" y="62" font-size="27">北 ↑</text><text x="817" y="103" font-size="19">西 ←　→ 東</text><text x="61" y="58" font-size="23" font-weight="600">濱海灣・方位參考</text></g><a href="https://www.google.com/maps/search/?api=1&query=Mandarin%20Oriental%20Singapore" target="_blank" rel="noopener noreferrer" aria-label="文華東方酒店，開啟 Google Maps"><title>文華東方酒店</title><path d="M469.0 146.5 L465.0 105" fill="none" stroke="#65746d" stroke-width="1.5"/><circle cx="469.0" cy="146.5" r="10" fill="#a97535" stroke="#fffdf8" stroke-width="3"/><rect x="385" y="80" width="160" hei